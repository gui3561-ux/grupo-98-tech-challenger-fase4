[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-stock-prediction"
version = "0.1.0"
description = "LSTM de fechamento D+1 de PETR4.SA com API FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "psutil>=6.0",
    "pyarrow>=16.0",
    "pytest>=8.0",
    "httpx>=0.27",
    # Fase 4 — Credit Scoring MLOps (Etapas 1-3)
    "xgboost>=2.0",          # modelo base de risco de crédito
    "pandera>=0.20",         # contratos de qualidade de dados (Data Contracts)
    "evidently>=0.4",        # detecção de Data/Concept Drift + relatórios HTML
    "scipy>=1.13",           # testes estatísticos (KS, PSI auxiliar)
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
# Dependências pesadas exclusivas da Fase 3 (LSTM/PETR4). Não são necessárias
# para a Fase 4; ficam fora do install padrão para não travar o `uv sync`
# (tensorflow não tem wheel para todas as plataformas/versões de Python).
legacy = [
    "yfinance>=0.2.40",
    "tensorflow>=2.16",
]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]
data = [
    "ucimlrepo>=0.0.7",      # recuperar target original do German Credit (UCI id=144)
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
