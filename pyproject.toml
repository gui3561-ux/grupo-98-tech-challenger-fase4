[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lstm-stock-prediction"
version = "0.1.0"
description = "LSTM de fechamento D+1 de PETR4.SA com API FastAPI"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "tensorflow>=2.16",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "psutil>=6.0",
    "pyarrow>=16.0",
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
